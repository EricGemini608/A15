<!DOCTYPE html>

    <style>
        /* 開始遊戲遮罩畫面 */
        #startScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a252f;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        /* 縮放手繪封面圖，保持完美比例 */
        #startScreen .cover-container {
            width: 85%; max-width: 380px; height: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); border-radius: 15px;
            background-color: #2c3e50;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            border: 4px solid #f1c40f;
        }
        /* 提示點擊文字 */
        .click-hint {
            color: #f1c40f; font-size: 18px; font-weight: bold; margin-top: 15px;
            animation: blink 1.5s infinite; font-family: sans-serif;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* 隱藏動畫特效 */
        #startScreen.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
        
        body {
            margin: 0; background-color: #1a252f;
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; color: white; overflow: hidden; touch-action: manipulation;
        }
        h1 { margin: 5px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); font-size: 24px; text-align: center; }
        .info-panel { display: flex; gap: 15px; margin-bottom: 5px; font-size: 16px; }
        .score-box { background-color: #27ae60; padding: 5px 12px; border-radius: 10px; font-weight: bold; border: 2px solid #fff; }
        .remain-box { background-color: #2980b9; padding: 5px 12px; border-radius: 10px; font-weight: bold; border: 2px solid #fff; }
        #gameCanvas { background-color: #2c3e50; border: 10px solid #f1c40f; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.7); max-width: 95vw; max-height: 60vh; }
        .controls-container { display: flex; gap: 15px; margin-top: 10px; width: 90%; max-width: 400px; justify-content: center; }
        .touch-btn {
            background-color: #e67e22; color: white; border: 3px solid #d35400; border-radius: 12px;
            padding: 12px 20px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px #ba4a00; user-select: none; flex: 1; text-align: center;
        }
        .touch-btn:active { box-shadow: 0 1px #ba4a00; transform: translateY(3px); background-color: #d35400; }
        .action-btn { background-color: #e74c3c; border-color: #c0392b; box-shadow: 0 4px #962d22; }
        .action-btn:active { background-color: #c0392b; box-shadow: 0 1px #962d22; }
        .quiz-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
        .quiz-container { background-color: #ffffff; color: #333; padding: 20px; border-radius: 20px; max-width: 450px; width: 85%; box-shadow: 0 5px 30px rgba(0,0,0,0.5); border-top: 12px solid #ccc; max-height: 85vh; overflow-y: auto; }
        .quiz-header { font-size: 14px; font-weight: bold; margin-bottom: 5px; padding: 4px 10px; border-radius: 5px; display: inline-block; }
        .quiz-question { font-size: 17px; font-weight: bold; margin: 10px 0; line-height: 1.4; color: #2c3e50; }
        .option-btn { display: block; width: 100%; padding: 10px; margin: 6px 0; font-size: 15px; text-align: left; background-color: #f8f9fa; border: 2px solid #dee2e6; border-radius: 10px; cursor: pointer; color: #495057; }
        .result-box { margin-top: 10px; padding: 12px; border-radius: 10px; display: none; line-height: 1.5; font-size: 14px; }
        .result-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .result-wrong { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .next-btn { display: none; width: 100%; padding: 12px; margin-top: 12px; font-size: 16px; background-color: #2ecc71; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .game-over-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; color: #333; padding: 30px; border-radius: 25px; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.8); display: none; z-index: 200; width: 75%; max-width: 350px; }
        .final-score { font-size: 40px; color: #e74c3c; font-weight: bold; margin: 15px 0; }
        .final-msg { font-size: 18px; font-weight: bold; line-height: 1.5; color: #2c3e50; }
        .rules { font-size: 12px; color: #bdc3c7; margin-top: 5px; text-align: center; }
    </style>
</head>

        </div>
        <div class="click-hint">👉 點選任意處開始挑戰 👈</div>

    <h1>💊 抗高血壓藥物與血管擴張劑答題機 💊</h1>
    <div class="info-panel">
        <div class="score-box">得分：<span id="scoreText">0</span> / 2700</div>
        <div class="remain-box">剩餘：<span id="remainText">20</span> 顆</div>
    </div>
    <canvas id="gameCanvas" width="450" height="500"></canvas>

        <div class="touch-btn" id="btnLeft">⬅️ 左移</div>
        <div class="touch-btn action-btn" id="btnDrop">🕹️ 下抓</div>
        <div class="touch-btn" id="btnRight">右移 ➡️</div>

    <div class="rules">電腦玩家也可用【 ← 】【 → 】與【 空白鍵 】控制</div>
    
    <div class="quiz-overlay" id="quizOverlay">
        <div class="quiz-container" id="quizContainer">
            <div class="quiz-header" id="quizHeader">題目難度</div>
            <div class="quiz-question" id="quizQuestion">題目載入中...</div>
            <div id="optionsBox"></div>
            <div class="result-box" id="resultBox"></div>
            <button class="next-btn" id="nextBtn" onclick="closeQuiz()">看懂了，繼續抓球！</button>
        </div>
    </div>
    <div class="game-over-panel" id="gameOverPanel">
        <h2>📊 結算報告 📊</h2>
        <div class="final-score" id="finalScoreDisplay">0</div>
        <div class="final-msg" id="finalMsgDisplay">評語加載中...</div>

    <script>
        let audioCtx = null;
        let gameStarted = false; // 用來防止還沒開始就抓取

        function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
        function playDropSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = "sawtooth"; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
        function playCatchSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = "sine"; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.08); 
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }
        function playMissSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = "triangle"; osc.frequency.setValueAtTime(130.81, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function startGame() {
            if (gameStarted) return;
            initAudio();
            gameStarted = true;
            const startScreen = document.getElementById("startScreen");
            startScreen.classList.add("hidden");
            setTimeout(() => {
                startScreen.style.display = "none";
            }, 400);
        }

        window.onload = function() {
            initBalls(); 
            gameLoop();
        };

        const quizBank = {
            white: [
                { q: "請問有關抗高血壓藥物 Sodium Nitroprusside 的敘述下列何者錯誤？", opts: ["副作用有姿位性低血壓、反射性心跳過速", "嚴重低血壓危象的急救", "這個藥物對光敏感，宜避光使用"], ans: 1, note: "解析：應該是高血壓危害（危象）的急救。" },
                { q: "請問有關抗高血壓藥物 Hydralazine 的敘述下列何者錯誤？", opts: ["高劑量可能引起可逆性類紅斑性狼瘡症狀", "因擴張血管使得反射性心跳增加", "常與利尿劑或交感神經Alpha接受器阻斷劑併用"], ans: 2, note: "解析：常與利尿劑或交感神經Beta接受器阻斷劑併用。" },
                { q: "請問有關抗高血壓藥物 Minoxidil 的敘述下列何者正確？", opts: ["會活化血管平滑肌細胞的鉀離子通道，使細胞內鉀離子外流，使膜電位過極化，降低血管興奮性", "本產品對光過敏，宜避光使用", "會造成少毛症"], ans: 0, note: "解析：B選項的藥物是Sodium Nitroprusside；C應為多
