<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 迷你夾娃娃機遊戲 ⚡</title>
    <style>
        /* CSS：設定遊戲畫面置中與背景 */
        body {
            margin: 0;
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        h1 {
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .instructions {
            font-size: 16px;
            color: #bdc3c7;
            margin-bottom: 15px;
        }
        /* 娃娃機的外框 */
        #gameCanvas {
            background-color: #34495e;
            border: 10px solid #f1c40f;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .score-board {
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
            background-color: #e74c3c;
            padding: 5px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <h1>🧸 迷你夾娃娃機 🧸</h1>
    <div class="instructions">操作說明：鍵盤【 ← 】【 → 】移動夾子，【 空白鍵 】往下抓</div>

    <!-- 遊戲畫布：所有的動畫都會在這裡畫出來 -->
    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <div class="score-board">分數：<span id="score">0</span></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");

        let score = 0;

        // 1. 夾子（Claw）的屬性設定
        let claw = {
            x: 200,          // 夾子的 X 座標
            y: 40,           // 夾子頂部的 Y 座標
            width: 40,
            height: 30,
            ropeLength: 0,   // 繩子往下延伸的長度
            state: "IDLE",   // 狀態：IDLE(靜止), DROP(下降), RETRACT(收回), CATCH(抓到回程)
            speed: 4         // 移動速度
        };

        // 2. 娃娃（Dolls）的資料
        let dolls = [];
        const dollColors = ["#e74c3c", "#9b59b6", "#1abc9c", "#e67e22", "#fd79a8"]; // 娃娃的各種顏色
        
        // 生成一隻隨機位置的娃娃
        function spawnDoll() {
            return {
                x: Math.random() * (canvas.width - 60) + 30,
                y: canvas.height - 40, // 固定在底部
                radius: 18,
                color: dollColors[Math.floor(Math.random() * dollColors.length)],
                isCaught: false
            };
        }

        // 一開始先放 4 隻娃娃在底部
        for (let i = 0; i < 4; i++) {
            dolls.push(spawnDoll());
        }

        // 3. 監聽鍵盤事件
        let keys = {};
        window.addEventListener("keydown", (e) => { keys[e.code] = true; });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        // 4. 遊戲主邏輯迴圈（每一秒會跑大約 60 次）
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop); // 讓瀏覽器持續更新動畫
        }

        // 更新所有物件的位置和狀態
        function update() {
            // A. 控制夾子左右移動（只有在靜止狀態可以移動）
            if (claw.state === "IDLE") {
                if (keys["ArrowLeft"] && claw.x > 20) {
                    claw.x -= claw.speed;
                }
                if (keys["ArrowRight"] && claw.x < canvas.width - 20) {
                    claw.x += claw.speed;
                }
                if (keys["Space"]) {
                    claw.state = "DROP"; // 按空白鍵，狀態變成下降
                }
            }

            // B. 夾爪下降狀態
            if (claw.state === "DROP") {
                claw.ropeLength += 5; // 繩子變長

                // 檢查有沒有碰到任何一隻娃娃（碰撞偵測）
                let clawBottomY = claw.y + claw.ropeLength + claw.height;
                
                for (let doll of dolls) {
                    // 計算夾爪中心和娃娃中心的距離
                    let dx = claw.x - doll.x;
                    let dy = clawBottomY - doll.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    // 如果距離夠近，代表抓到了！
                    if (distance < doll.radius + 15) {
                        claw.state = "CATCH";
                        doll.isCaught = true;
                        break;
                    }
                }

                // 如果到底部都沒抓到，強迫收回
                if (clawBottomY >= canvas.height - 10) {
                    claw.state = "RETRACT";
                }
            }

            // C. 抓到娃娃回程狀態
            if (claw.state === "CATCH") {
                claw.ropeLength -= 5;
                // 讓被抓到的娃娃跟著夾爪一起往上跑
                for (let doll of dolls) {
                    if (doll.isCaught) {
                        doll.x = claw.x;
                        doll.y = claw.y + claw.ropeLength + claw.height;
                    }
                }

                // 當夾爪回到最頂端
                if (claw.ropeLength <= 0) {
                    claw.ropeLength = 0;
                    claw.state = "IDLE";
                    
                    // 加分，並把被抓走的娃娃移除，補一隻新娃娃
                    score += 1;
                    scoreDisplay.innerText = score;
                    dolls = dolls.filter(d => !d.isCaught);
                    dolls.push(spawnDoll());
                }
            }

            // D. 沒抓到東西空手收回狀態
            if (claw.state === "RETRACT") {
                claw.ropeLength -= 5;
                if (claw.ropeLength <= 0) {
                    claw.ropeLength = 0;
                    claw.state = "IDLE";
                }
            }
        }

        // 把所有的東西畫到畫布（Canvas）上
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 先清空舊畫面

            // A. 畫娃娃機頂部天車軌道
            ctx.strokeStyle = "#7f8c8d";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, claw.y);
            ctx.lineTo(canvas.width, claw.y);
            ctx.stroke();

            // B. 畫夾爪的繩子
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(claw.x, claw.y);
            ctx.lineTo(claw.x, claw.y + claw.ropeLength);
            ctx.stroke();

            // C. 畫夾爪本體
            let currentClawY = claw.y + claw.ropeLength;
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(claw.x - 15, currentClawY, 30, 15); // 夾頭

            // 畫左爪和右爪
            ctx.strokeStyle = "#d35400";
            ctx.lineWidth = 4;
            
            // 左爪
            ctx.beginPath();
            ctx.moveTo(claw.x - 15, currentClawY + 15);
            ctx.lineTo(claw.x - 25, currentClawY + 35);
            ctx.lineTo(claw.x - 10, currentClawY + 40);
            ctx.stroke();

            // 右爪
            ctx.beginPath();
            ctx.moveTo(claw.x + 15, currentClawY + 15);
            ctx.lineTo(claw.x + 25, currentClawY + 35);
            ctx.lineTo(claw.x + 10, currentClawY + 40);
            ctx.stroke();

            // D. 畫娃娃們（用可愛的圓形代替）
            for (let doll of dolls) {
                ctx.fillStyle = doll.color;
                ctx.beginPath();
                ctx.arc(doll.x, doll.y, doll.radius, 0, Math.PI * 2);
                ctx.fill();

                // 給娃娃畫一雙小眼睛，看起來比較可愛
                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(doll.x - 6, doll.y - 2, 2, 0, Math.PI * 2); // 左眼
                ctx.arc(doll.x + 6, doll.y - 2, 2, 0, Math.PI * 2); // 右眼
                ctx.fill();
            }

            // E. 畫下方的出物口擋板
            ctx.fillStyle = "#7f8c8d";
            ctx.fillRect(0, canvas.height - 50, 60, 10);
            ctx.fillRect(50, canvas.height - 50, 10, 50);
        }

        // 啟動遊戲
        gameLoop();
    </script>
</body>
</html>
